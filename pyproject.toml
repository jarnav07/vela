[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vela"
version = "0.1.0"
description = "ML equity signal research, vectorised backtesting and portfolio tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vela*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
